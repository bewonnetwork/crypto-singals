# এই ফাইল GitHub কে বলে: প্রতি ১৫ মিনিটে বট একবার চালাও (সম্পূর্ণ ফ্রি)
name: Signal Bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"     # প্রতি ১৫ মিনিটে (UTC সময়)
  workflow_dispatch:                  # হাতে চালানোর জন্য "Run workflow" বাটন
    inputs:
      mode:
        description: "test = টেস্ট মেসেজ, once = সিগনাল চেক, digest = দৈনিক সারাংশ"
        type: choice
        options: [test, once, digest]
        default: test

permissions:
  contents: write                     # state.json সেভ করার অনুমতি

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NEWS_CHAT_ID: ${{ secrets.TG_NEWS_CHAT_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python signal_bot.py --${{ github.event.inputs.mode || 'once' }}

      - name: Save memory (state.json)
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json docs/data || true
          git diff --cached --quiet || (git commit -m "bot state update" && git pull --rebase && git push)
