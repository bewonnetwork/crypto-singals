<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEWON TestScan — Demo Testnet Explorer</title>
<meta name="description" content="BEWON TestScan: a pretend testnet explorer for learning. Nothing here exists on a real blockchain.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#f8f9fb;--card:#fff;--ink:#1b2430;--muted:#6c7785;--line:#e6eaf0;--pri:#1273c4;--pri-soft:#eaf3fb;--up:#0b9f6a;--up-soft:#e6f6ef;--warn:#a86f0a;--warn-soft:#fff5dc;--down:#d63a50;--down-soft:#fdecef;--sunk:#f3f5f8;--sh:0 1px 3px rgba(20,30,50,.06)}
:root[data-t="dark"]{--bg:#0b0e13;--card:#12171f;--ink:#e7eaef;--muted:#8a94a4;--line:rgba(255,255,255,.09);--pri:#5aa9f0;--pri-soft:rgba(90,169,240,.12);--up:#22c58b;--up-soft:rgba(34,197,139,.12);--warn:#f2b33d;--warn-soft:rgba(242,179,61,.1);--down:#f0607a;--down-soft:rgba(240,96,122,.12);--sunk:#0e1219;--sh:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Hind Siliguri",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sbar{background:var(--card);border-bottom:1px solid var(--line)}
.sbar .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.sbar form{flex:1;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:0 10px;max-width:560px}
.sbar input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:0;font-size:13.5px}
.sbar svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.pillx{font:600 11.5px Inter,sans-serif;padding:5px 9px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;font-size:18px;letter-spacing:-.01em}.brand:hover{text-decoration:none}
.brand img{width:32px;height:32px;border-radius:50%}.brand small{display:block;font:500 10.5px Inter,sans-serif;color:var(--muted);letter-spacing:0}
.badge{font:700 10px/1 Inter,sans-serif;letter-spacing:.08em;padding:4px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
nav.mn{margin-left:auto;display:flex;gap:2px;align-items:center}
.dd{position:relative}.dd>button,nav.mn>a{border:0;background:none;padding:8px 11px;border-radius:7px;font:500 13.5px Inter,"Hind Siliguri",sans-serif;color:var(--ink);cursor:pointer;display:block}
.dd>button:hover,nav.mn>a:hover,nav.mn .on{background:var(--sunk);text-decoration:none}
.dd>div{display:none;position:absolute;right:0;top:100%;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(10,20,40,.14);z-index:30}
.dd:hover>div,.dd.open>div{display:grid}.dd>div a{padding:8px 10px;border-radius:6px;color:var(--ink);font-size:13.5px}.dd>div a:hover{background:var(--sunk);text-decoration:none}
#mb{display:none}
.warn{background:var(--warn-soft);color:var(--warn);font-size:12px;border-bottom:1px solid var(--line)}.warn .wrap{padding-block:6px}@media (max-width:900px){.warn{font-size:11px;line-height:1.4}}
main{display:grid;gap:14px;padding:16px 0 36px}
h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:600}h1 small{font:400 13px Inter,sans-serif;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.stats>div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;min-width:0}
.stats>div:nth-child(4n){border-right:0}.stats>div:nth-last-child(-n+4){border-bottom:0}
.stats i{width:34px;height:34px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-style:normal;flex:none;font-size:16px}
.stats span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.stats b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.card>h2{margin:0;padding:13px 16px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>h2 small{font:400 12px Inter,sans-serif;color:var(--muted)}
.more{display:block;text-align:center;padding:11px;border-top:1px solid var(--line);font:500 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}
.row:last-of-type{border-bottom:0}.row.new{animation:fl 1.6s ease}
@keyframes fl{0%{background:var(--pri-soft)}100%{background:transparent}}
.ic{width:38px;height:38px;border-radius:9px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font:600 11px Inter,sans-serif}
.row small,.kv small{display:block;color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.val{font:600 11.5px Inter,sans-serif;padding:4px 7px;border:1px solid var(--line);border-radius:6px;white-space:nowrap;background:var(--card)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 12px Inter,"Hind Siliguri",sans-serif;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}
.kv>div{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.kv>div:last-child{border-bottom:0}.kv>div>span:first-child{color:var(--muted)}.kv .mono{word-break:break-all}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font:600 11.5px Inter,sans-serif;border:1px solid var(--line);background:var(--sunk)}
.ok{background:var(--up-soft);color:var(--up);border-color:transparent}.pend{background:var(--warn-soft);color:var(--warn);border-color:transparent}.bad{background:var(--down-soft);color:var(--down);border-color:transparent}
.in{background:var(--up-soft);color:var(--up)}.out{background:var(--warn-soft);color:var(--warn)}
.mine{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;font:700 10px Inter,sans-serif;background:var(--pri-soft);color:var(--pri)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.pg{display:flex;gap:6px;justify-content:flex-end;align-items:center;padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.pg a,.pg span{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs a{padding:7px 12px;border-radius:8px;font:500 13px Inter,"Hind Siliguri",sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line)}.tabs a.on{background:var(--pri);color:#fff;border-color:var(--pri)}.tabs a:hover{text-decoration:none}
.form{padding:18px;display:grid;gap:14px;max-width:620px}.form label{display:grid;gap:6px;font-size:13px}
.form input,.form select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%}
.form .rd{display:flex;gap:18px}.form .rd label{display:flex;gap:6px;align-items:center}
.act{padding:14px 18px;background:var(--sunk);border-top:1px solid var(--line);display:flex;gap:14px;align-items:center}
.btn{padding:9px 18px;border-radius:8px;border:0;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}.lnk{border:0;background:none;color:var(--muted);cursor:pointer}
.res{margin:0 18px 18px;padding:14px;border-radius:10px;background:var(--pri-soft);font-size:13.5px}.res b{font-size:18px}
.bar{height:4px;background:var(--sunk);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .25s linear}
.gas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}.gas div{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}.gas b{display:block;font-size:22px;font-weight:600}.gas span{color:var(--muted);font-size:12px}
.nfts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:16px}.nft{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;font-size:12.5px}.nft svg{width:100%;border-radius:8px}
.spark{width:100%;height:60px;display:block}
footer{color:var(--muted);font-size:12px;padding:0 0 28px;text-align:center}
.wm{position:relative}.wm::after{content:"DEMO";position:absolute;right:18px;top:46px;font:800 64px Inter,sans-serif;letter-spacing:.1em;color:var(--ink);opacity:.045;transform:rotate(-12deg);pointer-events:none}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>div:nth-child(2n){border-right:0}.stats>div:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.stats>div:nth-last-child(-n+2){border-bottom:0}
  .kv>div{grid-template-columns:minmax(0,1fr);gap:2px}
  #mb{display:grid;margin-left:auto}nav.mn{display:none;position:absolute;left:0;right:0;top:100%;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;flex-direction:column;align-items:stretch;margin:0}nav.mn.open{display:flex}
  .dd>div{position:static;display:grid;border:0;box-shadow:none;padding:0 0 0 12px}.dd>button{font-weight:600;width:100%;text-align:left}
  .row{grid-template-columns:auto minmax(0,1fr) auto}.row .mid{display:none}.pillx.h{display:none}.wm::after{font-size:44px}
}
</style>
</head>
<body>
<div class="sbar"><div class="wrap"><form id="sf"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" autocomplete="off" spellcheck="false"></form><span class="pillx h" id="gasP"></span><button class="ib" id="thB" aria-label="Theme">◐</button></div></div>
<header><div class="wrap"><a class="brand" href="#/"><img src="../logo-mark.png" alt=""><span>BEWON TestScan<small id="tag"></small></span></a><span class="badge">DEMO</span>
  <button class="ib" id="mb" aria-label="Menu">☰</button>
  <nav class="mn" id="mn"><a href="#/" id="nHome"></a>
    <div class="dd"><button id="nBc"></button><div><a href="#/txs" id="nTx"></a><a href="#/blocks" id="nBl"></a><a href="#/validators" id="nVa"></a></div></div>
    <div class="dd"><button id="nTk"></button><div><a href="#/tokens" id="nTl"></a><a href="#/nfts" id="nNf"></a></div></div>
    <div class="dd"><button id="nTo"></button><div><a href="#/tools/balance" id="nT1"></a><a href="#/tools/unit" id="nT2"></a><a href="#/tools/gas" id="nT3"></a><a href="../#/demo/web3" id="nT4"></a></div></div>
    <a href="../#/demo/wallet" id="nWa"></a></nav></div></header>
<div class="warn"><div class="wrap" id="warn"></div></div>
<div class="wrap"><main id="app"></main><footer id="ft"></footer></div>
<script>
"use strict";
/* BEWON TestScan — a pretend testnet explorer for learning. It shows the visitor's own demo activity (from this browser)
   inside a clearly pretend chain. Nothing here exists on a real blockchain or has any monetary value. */
let LANG="bn"; try{ const l=localStorage.getItem("lang"); if(l&&l!=="bn") LANG="en"; }catch(e){}
try{ const t=localStorage.getItem("scan_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"); document.documentElement.dataset.t=t; }catch(e){}
const tr=(bn,en)=>LANG==="en"?en:bn, $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BT=3000, EPOCH=Date.UTC(2026,0,1), G0=40000000, height=()=>G0+Math.floor((Date.now()-EPOCH)/BT), btime=n=>EPOCH+(n-G0)*BT;
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const hexR=(r,n)=>Array.from({length:n},()=>Math.floor(r()*16).toString(16)).join("");
const seedOf=s=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
const POOL=Array.from({length:60},(_,i)=>"0xDEMO"+hexR(rng(9000+i),34).toUpperCase());   // a fixed set of pretend accounts so addresses repeat like on a real chain
const TOK=[{s:"tBNB",n:"Test BNB",native:true,dec:18},{s:"BWN",n:"BEWON Demo Token",ca:"0xDEMO00000000000000000000000000000000BWN1",sup:1e9,dec:18},{s:"dUSDT",n:"Demo Tether USD",ca:"0xDEMO0000000000000000000000000000000DUSDT",sup:5e8,dec:6},{s:"dBTC",n:"Demo Bitcoin",ca:"0xDEMO00000000000000000000000000000000DBTC",sup:21e6,dec:8},{s:"dETH",n:"Demo Ether",ca:"0xDEMO00000000000000000000000000000000DETH",sup:12e7,dec:18},{s:"BWN",n:"BEWON Demo Token (copy)",ca:"0xDEMO00000000000000000000000000000000BWN7",sup:1e15,dec:18,fake:true}];
const METH=[["Transfer","0x"],["Transfer","0xa9059cbb"],["Approve","0x095ea7b3"],["Swap","0x38ed1739"],["Mint","0x40c10f19"],["Claim","0x4e71d92d"]];
function extra(hash){ const r=rng(seedOf(hash)), gp=+(3+r()*2).toFixed(2), gl=[21000,60000,120000,210000][Math.floor(r()*4)], gu=Math.round(gl*(0.55+r()*0.4)); return {gp,gl,gu,nonce:Math.floor(r()*900),pos:Math.floor(r()*120)}; }
function simBlock(n){ const r=rng(n*2654435761%4294967296), cnt=2+Math.floor(r()*6), txs=[];
  for(let i=0;i<cnt;i++){ const tail=hexR(r,54), k=Math.floor(r()*METH.length), coin=k===0?"tBNB":["dUSDT","BWN","dBTC","dETH"][Math.floor(r()*4)], big=coin==="dUSDT"||coin==="BWN";
    txs.push({sim:true,hash:"0x"+n.toString(16).padStart(8,"0")+i.toString(16).padStart(2,"0")+tail,block:n,t:btime(n),from:POOL[Math.floor(r()*60)],to:k>=3?TOK[1+Math.floor(r()*4)].ca:POOL[Math.floor(r()*60)],
      amt:+(r()*(big?900:coin==="tBNB"?4:0.6)).toFixed(4),coin,fee:0,feeCoin:"tBNB",net:"BEWON Testnet (demo)",label:METH[k][0],sig:METH[k][1],done:r()>.02,fail:false}); }
  txs.forEach(x=>{ const e=extra(x.hash); x.fee=+(e.gp*e.gu/1e9).toFixed(6); if(!x.done){ x.done=true; x.fail=true; } });
  return {n,t:btime(n),val:1+n%21,txs,gasUsed:txs.reduce((a,x)=>a+extra(x.hash).gu,0),gasLimit:140000000,size:900+txs.length*310,reward:+(txs.reduce((a,x)=>a+x.fee,0)).toFixed(6)}; }
function store(){ try{ return JSON.parse(localStorage.getItem("bewon_demo_v1")||"null"); }catch(e){ return null; } }
function mine(){ const d=store(); if(!d||!Array.isArray(d.wtx)) return {d:null,txs:[]}; const H=height(), need={BEP20:15,TRC20:20,ERC20:6};
  return {d,txs:d.wtx.map(x=>{ const conf=Math.max(0,Math.floor((Date.now()-new Date(x.t))/1000)), nd=need[x.net]||1, done=x.done||!["dep","wd"].includes(x.type)||conf>=nd, w3=x.type==="w3";
    return {mine:true,hash:x.hash,block:Math.min(x.block||H,H),t:+new Date(x.t),from:x.from||"—",to:x.to||"—",amt:x.amt||0,coin:x.coin||"USDT",fee:x.fee||0,feeCoin:w3?"tBNB":"USDT",net:x.net||"—",
      label:x.type==="dep"?"Deposit":x.type==="wd"?"Withdraw":x.type==="p2p"?"P2P "+(x.label||""):(x.label||"Web3"),sig:w3?"0xa9059cbb":"0x",done,conf:Math.min(conf,nd),need:nd}; })}; }
function ago(t){ const s=Math.max(0,Math.round((Date.now()-t)/1000)); if(s<60) return tr(`${s} সেকেন্ড আগে`,`${s} secs ago`); const m=Math.round(s/60); if(m<60) return tr(`${m} মিনিট আগে`,`${m} mins ago`); const h=Math.round(m/60); if(h<48) return tr(`${h} ঘণ্টা আগে`,`${h} hrs ago`); return tr(`${Math.round(h/24)} দিন আগে`,`${Math.round(h/24)} days ago`); }
const sh=(h,a=10,b=6)=>h.length>a+b+3?h.slice(0,a)+"…"+h.slice(-b):h, num=(x,d=6)=>(+x).toLocaleString("en-US",{maximumFractionDigits:d});
const aL=(a,short)=>`<a class="mono" href="#/address/${encodeURIComponent(a)}" title="${esc(a)}">${esc(short?sh(a,10,6):a)}</a>`, txL=h=>`<a class="mono" href="#/tx/${h}">${sh(h,12,6)}</a>`;
const cp=t=>`<button class="lnk" data-cp="${esc(t)}" title="Copy">⧉</button>`;
function findTx(h){ h=String(h||"").trim(); const m=mine().txs.find(x=>x.hash.toLowerCase()===h.toLowerCase()); if(m) return m;
  if(/^0x[0-9a-f]{64}$/i.test(h)){ const n=parseInt(h.slice(2,10),16), i=parseInt(h.slice(10,12),16); if(n>=G0&&n<=height()){ const t=simBlock(n).txs[i]; if(t&&t.hash===h.toLowerCase()) return t; } } return null; }
const stTag=x=>x.fail?`<span class="tag bad">✕ Failed</span>`:x.done?`<span class="tag ok">✔ Success</span>`:`<span class="tag pend">⏳ Pending ${x.conf}/${x.need}</span>`;
function txRow(x,cls){ return `<div class="row ${cls||""}"><div class="ic">Tx</div><div>${txL(x.hash)}${x.mine?`<span class="mine">${tr("আপনার","YOURS")}</span>`:""}<small data-t="${x.t}">${ago(x.t)}</small></div><div class="mid"><span class="el">${tr("থেকে","From")} ${aL(x.from,1)}</span><span class="el">${tr("প্রতি","To")} ${aL(x.to,1)}</span></div><div><span class="val">${num(x.amt,4)} ${esc(x.coin)}</span></div></div>`; }
function blRow(b,cls){ return `<div class="row ${cls||""}"><div class="ic">Bk</div><div><a class="mono" href="#/block/${b.n}">${b.n}</a><small data-t="${b.t}">${ago(b.t)}</small></div><div class="mid"><span class="el">${tr("যাচাইকারী","Validated by")} <a href="#/validators">Validator ${b.val}</a></span><small><a href="#/block/${b.n}">${b.txs.length} txns</a> · 3 secs</small></div><div><span class="val">${b.reward} tBNB</span></div></div>`; }

   <div class="card"><h2>Profile</h2><div class="kv"><div><span>Contract</span><span>${t.native?tr("নেটিভ কয়েন (কন্ট্রাক্ট নেই)","Native coin (no contract)"):aL(t.ca)+" "+cp(t.ca)}</span></div><div><span>${tr("ধরন","Type")}</span><span>${t.native?"Native":"BEP-20"} <span class="badge">DEMO</span></span></div></div></div></div>

function pageNfts(){ const d=store(), n=(d&&d.w3&&d.w3.nfts)||[], art=x=>{ const h=(x.s*47)%360; return `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="12" fill="hsl(${h},55%,16%)"/><circle cx="${30+x.s%40}" cy="${35+x.s%25}" r="${18+x.s%12}" fill="hsl(${(h+40)%360},80%,60%)" opacity=".85"/><rect x="${20+x.s%30}" y="${50+x.s%15}" width="${30+x.s%20}" height="${22+x.s%10}" rx="6" fill="hsl(${(h+200)%360},75%,62%)" opacity=".8"/></svg>`; };
  app.innerHTML=`<h1>NFT <small>BEWON Demo Collection (BEP-721 demo)</small></h1><div class="card">${n.length?`<div class="nfts">${n.map(x=>{ const t=(d.wtx||[]).find(w=>w.id===x.tx); return `<div class="nft">${art(x)}<b>BEWON Demo #${x.n}</b><span>${tr("মালিক","Owner")}: ${aL(d.w3.addr,1)}</span>${t?`<span>Mint: ${txL(t.hash)}</span>`:""}</div>`; }).join("")}</div>`:`<div class="empty">${tr("আপনার এখনো কোনো ডেমো NFT নেই।","You have no demo NFTs yet.")} <a href="../#/demo/web3">${tr("Web3 ওয়ালেটে গিয়ে একটা Mint করুন →","Mint one in the Web3 wallet →")}</a></div>`}</div>`; }
function pageVals(){ const H=height(); app.innerHTML=`<h1>${tr("যাচাইকারী","Validators")} <small>(demo)</small></h1><div class="card"><div class="tw"><table><thead><tr><th>#</th><th>Validator</th><th>Address</th><th>Status</th><th>Blocks (24h)</th><th>Last Block</th></tr></thead><tbody>${Array.from({length:21},(_,i)=>{ const v=i+1, last=H-((H-v)%21+21)%21; return `<tr><td>${v}</td><td><b>Validator ${v}</b></td><td>${aL(POOL[v],1)}</td><td><span class="tag ok">Active</span></td><td>${num(Math.floor(28800/21),0)}</td><td><a href="#/block/${last}">${last}</a></td></tr>`; }).join("")}</tbody></table></div></div>
   <div class="card"><div class="empty" style="text-align:left">💡 ${tr("যাচাইকারীরা পালা করে ব্লক বানায় আর লেনদেন ঠিক আছে কিনা দেখে। আসল চেইনে এর জন্য তারা কয়েন জমা (stake) রাখে।","Validators take turns producing blocks and checking transactions. On a real chain they lock up (stake) coins to do this.")}</div></div>`; }
function toolTabs(k){ return `<div class="tabs"><a href="#/tools/balance" class="${k==="balance"?"on":""}">${tr("ব্যালান্স চেকার","Balance Checker")}</a><a href="#/tools/unit" class="${k==="unit"?"on":""}">${tr("ইউনিট কনভার্টার","Unit Converter")}</a><a href="#/tools/gas" class="${k==="gas"?"on":""}">${tr("গ্যাস ট্র্যাকার","Gas Tracker")}</a></div>`; }
function pageBalance(pre){ const d=store(), mineA=d&&d.w3&&d.w3.addr||"", today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<h1>Tools</h1>${toolTabs("balance")}<div><h1 style="font-size:16px">${tr("অ্যাকাউন্ট ব্যালান্স চেকার","Account Balance Checker")}</h1><p class="sub">${tr("কোনো ঠিকানার নির্দিষ্ট তারিখ বা ব্লকের ব্যালান্স দেখুন।","Look up an account's balance at a specific date or block number.")}</p></div>
   <form class="card" id="bf"><div class="form"><label>${tr("কী দেখবেন","Choose an option")}<select name="c">${[...new Set(TOK.filter(t=>!t.fake).map(t=>t.s))].map(s=>`<option>${s}</option>`).join("")}</select></label>
     <label>${tr("অ্যাকাউন্ট / কন্ট্রাক্ট ঠিকানা","Account Address / Contract Address")} *<input name="a" placeholder="0xDEMO…" value="${esc(decodeURIComponent(pre||"")||mineA)}" required></label>
     <div><div style="font-size:13px;margin-bottom:6px">Filter by:</div><div class="rd"><label><input type="radio" name="f" value="d" checked> Date</label><label><input type="radio" name="f" value="b"> Block Number</label></div></div>
     <label id="fd">${tr("কোন তারিখের","Date for the snapshot")}<input type="date" name="d" value="${today}" max="${today}"></label><label id="fb" hidden>Block Number<input type="number" name="b" value="${height()}" min="${G0}"></label></div>
     <div class="act"><button class="btn">Lookup</button><button type="reset" class="lnk">Reset</button></div><div id="br"></div></form>`;
  const f=$("#bf"); f.querySelectorAll("[name=f]").forEach(r=>r.onchange=()=>{ const b=f.f.value==="b"; $("#fd").hidden=b; $("#fb").hidden=!b; });
  f.onreset=()=>{ $("#br").innerHTML=""; setTimeout(()=>{ $("#fd").hidden=false; $("#fb").hidden=true; }); };
  f.onsubmit=e=>{ e.preventDefault(); const a=f.a.value.trim(), c=f.c.value, isB=f.f.value==="b", n=isB?Math.min(height(),Math.max(G0,+f.b.value||height())):null, until=isB?btime(n)+BT:new Date(f.d.value+"T23:59:59Z").getTime(), now=until>=Date.now()-6e4, {b,own}=balOf(a,now?0:until);
    let v=b[c]||0; if(!own&&!now){ v=+(v*(0.4+rng(seedOf(a)+Math.floor(until/864e5))()*0.6)).toFixed(4); }
    $("#br").innerHTML=`<div class="res">${tr("ব্যালান্স","Balance")} (${isB?"Block "+n:f.d.value}):<br><b>${num(v)} ${esc(c)}</b> <span class="badge">DEMO</span><br><small style="color:var(--muted)">${aL(a,1)} · ${own?tr("আপনার ডেমো লেনদেন থেকে হিসাব করা","calculated from your demo transactions"):tr("নকল ঠিকানা, সংখ্যাটা উদাহরণ মাত্র","pretend address, the number is only an example")}</small></div>`; }; }
function pageUnit(){ app.innerHTML=`<h1>Tools</h1>${toolTabs("unit")}<div><h1 style="font-size:16px">${tr("ইউনিট কনভার্টার","Unit Converter")}</h1><p class="sub">${tr("১ tBNB = ১০০ কোটি Gwei = ১০^১৮ Wei। গ্যাসের দাম Gwei-তে লেখা হয়।","1 tBNB = 1,000,000,000 Gwei = 10^18 Wei. Gas prices are quoted in Gwei.")}</p></div>
   <div class="card"><div class="form"><label>Wei<input id="u0" inputmode="decimal"></label><label>Gwei<input id="u9" inputmode="decimal"></label><label>tBNB<input id="u18" inputmode="decimal" value="1"></label></div></div>`;
  const P={u0:0,u9:9,u18:18}, set=from=>{ const v=parseFloat($("#"+from).value); Object.keys(P).forEach(k=>{ if(k!==from) $("#"+k).value=isFinite(v)?(v*Math.pow(10,P[from]-P[k])).toLocaleString("en-US",{useGrouping:false,maximumFractionDigits:18}):""; }); };
  Object.keys(P).forEach(k=>$("#"+k).oninput=()=>set(k)); set("u18"); }
function pageGas(){ const g=gasNow(), c=(gw,gl)=>(gw*gl/1e9).toFixed(6);
  app.innerHTML=`<h1>Tools</h1>${toolTabs("gas")}<div><h1 style="font-size:16px">${tr("গ্যাস ট্র্যাকার","Gas Tracker")} <span class="badge">DEMO</span></h1><p class="sub">${tr("গ্যাস ফি = গ্যাস দাম × ব্যবহৃত গ্যাস। নেটওয়ার্ক ব্যস্ত হলে দাম বাড়ে।","Gas fee = gas price × gas used. The price rises when the network is busy.")}</p></div>
   <div class="card"><div class="gas"><div><span>🐢 Low</span><b style="color:var(--up)">${g.lo}</b><span>Gwei</span></div><div><span>🚗 Average</span><b style="color:var(--pri)">${g.av}</b><span>Gwei</span></div><div><span>🚀 High</span><b style="color:var(--down)">${g.hi}</b><span>Gwei</span></div></div>
   <div class="tw"><table><thead><tr><th>${tr("কাজ","Action")}</th><th>Gas</th><th>Low</th><th>Average</th><th>High</th></tr></thead><tbody>${[["tBNB Transfer",21000],["Token Transfer",60000],["Swap",150000],["NFT Mint",120000]].map(([n,gl])=>`<tr><td>${n}</td><td>${num(gl,0)}</td><td>${c(g.lo,gl)} tBNB</td><td>${c(g.av,gl)} tBNB</td><td>${c(g.hi,gl)} tBNB</td></tr>`).join("")}</tbody></table></div></div>`; }
function route(keep){ const p=location.hash.replace(/^#\/?/,"").split("/"); if(keep!==true) window.scrollTo(0,0); HOME=null; $("#mn").classList.remove("open");
  if(p[0]==="tx") pageTx(p[1]); else if(p[0]==="block") pageBlock(p[1]); else if(p[0]==="blocks") pageBlocks(p[1]); else if(p[0]==="txs") pageTxs(p[1]); else if(p[0]==="address") pageAddr(p.slice(1).join("/"));
  else if(p[0]==="tokens") pageTokens(); else if(p[0]==="token") pageToken(p[1]||""); else if(p[0]==="nfts") pageNfts(); else if(p[0]==="validators") pageVals();
  else if(p[0]==="tools") (p[1]==="unit"?pageUnit:p[1]==="gas"?pageGas:()=>pageBalance(p.slice(2).join("/")))(); else pageHome(); }
$("#sf").onsubmit=e=>{ e.preventDefault(); const v=$("#q").value.trim(); if(!v) return; const tk=TOK.find(t=>t.s.toLowerCase()===v.toLowerCase()&&!t.fake);
  location.hash=/^\d+$/.test(v)?"#/block/"+v:/^0x[0-9a-f]{64}$/i.test(v)?"#/tx/"+v:tk?"#/token/"+tk.s:"#/address/"+encodeURIComponent(v); $("#q").value=""; };
document.addEventListener("click",e=>{ const c=e.target.closest("[data-cp]"); if(c){ try{ navigator.clipboard.writeText(c.dataset.cp); }catch(x){} c.textContent="✓"; setTimeout(()=>c.textContent="⧉",1200); }
  const d=e.target.closest(".dd>button"); document.querySelectorAll(".dd").forEach(x=>x.classList.toggle("open",!!d&&x===d.parentNode&&!x.classList.contains("open"))); });
$("#mb").onclick=()=>$("#mn").classList.toggle("open");
$("#thB").onclick=()=>{ const t=document.documentElement.dataset.t==="dark"?"light":"dark"; document.documentElement.dataset.t=t; try{ localStorage.setItem("scan_theme",t); }catch(e){} };
document.documentElement.lang=LANG;
const T={q:["Hash / ব্লক / ঠিকানা / টোকেন দিয়ে খুঁজুন","Search by Address / Txn Hash / Block / Token"],tag:["ডেমো টেস্টনেট এক্সপ্লোরার","Demo testnet explorer"],nHome:["হোম","Home"],nBc:["ব্লকচেইন ▾","Blockchain ▾"],nTx:["লেনদেন","Transactions"],nBl:["ব্লক","Blocks"],nVa:["যাচাইকারী","Validators"],nTk:["টোকেন ▾","Tokens ▾"],nTl:["টোকেন তালিকা","Token list"],nNf:["NFT","NFTs"],nTo:["টুলস ▾","Tools ▾"],nT1:["ব্যালান্স চেকার","Balance Checker"],nT2:["ইউনিট কনভার্টার","Unit Converter"],nT3:["গ্যাস ট্র্যাকার","Gas Tracker"],nT4:["Faucet (Web3 ওয়ালেট)","Faucet (Web3 wallet)"],nWa:["ডেমো ওয়ালেট","Demo wallet"]};
Object.entries(T).forEach(([k,v])=>{ const e=$("#"+k); if(!e) return; if(k==="q") e.placeholder=tr(v[0],v[1]); else e.textContent=tr(v[0],v[1]); });
$("#warn").textContent=tr("⚠️ এটা শেখার জন্য বানানো নকল টেস্টনেট এক্সপ্লোরার। এখানকার ব্লক, Hash, ঠিকানা, টোকেন আর ব্যালান্স কোনো আসল ব্লকচেইনে নেই এবং এগুলোর কোনো আর্থিক মূল্য নেই।","⚠️ This is a pretend testnet explorer for learning. The blocks, hashes, addresses, tokens and balances here do not exist on any real blockchain and have no monetary value.");
$("#ft").innerHTML="BEWON TestScan · DEMO · "+tr("আপনার লেনদেন শুধু আপনার এই ব্রাউজারেই দেখা যায়।","Your transactions are visible only in this browser.")+` · <a href="../">BEWON Signals</a>`;
const gp=()=>{ $("#gasP").textContent="⛽ "+gasNow().av+" Gwei"; }; gp(); setInterval(gp,15000);
window.addEventListener("hashchange",route); route();
setInterval(tickHome,250);
setInterval(()=>{ if(document.querySelector(".tag.pend")) route(true); },3000);
</script>
